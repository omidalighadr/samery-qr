[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "samery-qr"
version = "0.2.0"
description = "Read QR codes locally from images and print text or JSON."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/omidalighadr/samery-qr"

[project.scripts]
samery-qr = "scan_qr:main"

[tool.setuptools]
py-modules = ["scan_qr"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
